name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow never writes to the repo. The release workflow
# asks for contents: write separately, where it is actually needed.
permissions:
  contents: read

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # prebuild generates the icons and postbuild builds the IIFE content
      # script; npm runs both around this one command.
      - name: Build
        run: npm run build

      # The permission set is the product's central promise, so it is a build
      # gate rather than a review checklist item. Any reintroduction of
      # host_permissions or "tabs" fails CI loudly.
      - name: Assert the shipped permission set
        run: node scripts/check-manifest.mjs

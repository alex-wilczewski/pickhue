name: Release

# Tagging a version is the whole release. Pushing `3.2.0` builds the
# extension, re-runs every gate, and publishes a GitHub release with the
# upload-ready zip attached and that version's changelog entry as the notes.
# Nothing is built on a laptop, so what people download is what CI produced
# from the tagged commit.
on:
  push:
    # Tags are bare here (3.2.0), but v3.1.0 was pushed once from another
    # machine, and a stricter pattern would have done nothing at all — with
    # nothing anywhere to say why. Both spellings publish; the leading v is
    # stripped when the version is read.
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. 3.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build · verify · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json produces a zip whose filename
      # and manifest version differ from the release it is attached to, which
      # is confusing forever afterwards. Catch it before anything is published.
      - name: Check the tag matches package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG." >&2
            exit 1
          fi
          # VERSION names the zip and finds the changelog entry; TAG_NAME is
          # the ref exactly as pushed, which is what the release hangs under.
          echo "VERSION=$PKG" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert the shipped permission set
        run: node scripts/check-manifest.mjs

      # manifest.json has to sit at the root of the zip or the Web Store
      # rejects the upload.
      - name: Package
        run: |
          cd dist
          zip -qr "../pickhue-${VERSION}.zip" .
          cd ..
          unzip -l "pickhue-${VERSION}.zip" | head -20

      # Release notes are that version's section of CHANGELOG.md, so the
      # changelog stays the single place the story is written.
      - name: Extract the changelog entry
        run: |
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry for ${VERSION}." >&2
            exit 1
          fi
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-runnable: if a release for this tag already exists — a first
          # attempt that died after publishing, or a deliberate re-run from
          # the Actions tab — update it in place rather than failing at the
          # very last step with everything else already done.
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} exists; updating it."
            gh release edit "${TAG_NAME}" \
              --title "PickHue ${VERSION}" \
              --notes-file release-notes.md
            gh release upload "${TAG_NAME}" "pickhue-${VERSION}.zip" --clobber
          else
            gh release create "${TAG_NAME}" \
              --title "PickHue ${VERSION}" \
              --notes-file release-notes.md \
              "pickhue-${VERSION}.zip"
          fi
